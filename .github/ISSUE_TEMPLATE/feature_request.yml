name: 💡 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索 [已有 issue](../../issues?q=is%3Aissue+)，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 要解决的问题
      description: 描述你遇到的实际场景和痛点，比直接提方案更有助于设计。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望的功能形态或交互方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或目前用什么方式绕过的。

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考产品（同类 App 的做法）等。
